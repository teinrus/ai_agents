[project]
name = "ai-department"
version = "0.1.0"
description = "Платформа цифровых сотрудников"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pydantic>=2.10",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ai_department/api/routes.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ai_department", "roles"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["ai_department", "roles"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
